# -- Theme Options --
Logo = "img/logo-satwiki.png"
colorScheme = "blowfish"
defaultAppearance = "light"
autoSwitchAppearance = true

enableSearch = true
enableCodeCopy = true
enableStructuredBreadcrumbs = true
enableA11y = false

mainSections = ["news", "space-systems"]

[header]
  layout = "fixed-fill-blur"

[footer]
  showMenu = true
  showCopyright = true
  showThemeAttribution = true
  showAppearanceSwitcher = true
  showScrollToTop = true

[homepage]
  layout = "landing"
  showRecent = true
  showRecentItems = 5
  showMoreLink = true
  showMoreLinkDest = "/news/"
  cardView = false
  cardViewScreenWidth = false

[article]
  showDate = true
  showDateUpdated = false
  showAuthor = false
  showHero = false
  showBreadcrumbs = false
  showEdit = true
  editURL = "https://github.com/sat-wiki/sat-wiki.github.io/edit/main/src/content/"
  showHeadingAnchors = true
  showPagination = true
  showReadingTime = true
  showReadingProgress = true
  showTableOfContents = true
  showTaxonomies = true
  showCategories = true
  showTags = true
  showWordCount = true
  showZenMode = true
  showRelatedContent = true
  relatedContentLimit = 3

[list]
  showSummary = true
  showTableOfContents = false
  showCards = true
  groupByYear = true
  cardView = false

[taxonomy]
  showTermCount = true

[term]
  showTableOfContents = false
